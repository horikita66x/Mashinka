<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой дашборд</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(145deg, #0b2b3f, #1b4a3b 40%, #2d6a4f 70%, #52b788);
            font-family: system-ui, sans-serif;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: rgba(13,17,23,0.5);
            backdrop-filter: blur(12px);
            padding: 30px 25px;
            border-radius: 32px;
            max-width: 700px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.06);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
        }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
        .time { font-size: 28px; font-weight: 700; color: #fff; }
        .date { font-size: 13px; color: rgba(255,255,255,0.5); }
        .weather { background: rgba(255,255,255,0.06); padding: 6px 16px; border-radius: 30px; color: #fff; cursor: pointer; }
        .search-box { display: flex; gap: 10px; margin: 14px 0 22px; flex-wrap: wrap; }
        .search-box input { flex: 1; padding: 14px 20px; border-radius: 40px; border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.04); color: #fff; font-size: 15px; outline: none; min-width: 150px; }
        .search-box input::placeholder { color: rgba(255,255,255,0.3); }
        .search-box button { padding: 14px 24px; border-radius: 40px; border: none; background: linear-gradient(135deg, #2d6a4f, #52b788); color: #fff; font-weight: 600; cursor: pointer; }
        .tabs { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 18px; }
        .tabs span { padding: 5px 18px; border-radius: 20px; background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; }
        .tabs span.active { background: rgba(82,183,136,0.2); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
        .grid-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #f0f6fc; font-size: 12px; cursor: grab; padding: 6px; border-radius: 16px; border: 2px solid transparent; }
        .grid-item:hover { transform: translateY(-4px); }
        .icon-circle { width: 60px; height: 60px; background: rgba(255,255,255,0.04); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 6px; }
        .grid-item.drag-over { border-color: #52b788; background: rgba(82,183,136,0.05); }
        .quote-block { margin: 20px 0 12px; padding: 16px 20px; background: rgba(255,255,255,0.03); border-radius: 20px; border-left: 3px solid #52b788; font-size: 14px; color: rgba(255,255,255,0.7); font-style: italic; }
        .quote-block .author { font-style: normal; font-weight: 600; color: #52b788; margin-top: 6px; }
        .footer { margin-top: 20px; font-size: 11px; color: rgba(255,255,255,0.15); border-top: 1px solid rgba(255,255,255,0.02); padding-top: 14px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
        .footer button { background: none; border: 1px solid rgba(255,255,255,0.04); color: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 20px; cursor: pointer; font-size: 11px; }
        .footer button:hover { background: rgba(255,255,255,0.04); color: #fff; }
        .stats { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; font-size: 12px; color: rgba(255,255,255,0.4); margin: 8px 0 16px; }
        .stats .num { color: #52b788; font-weight: 700; }
        .timer-block { display: flex; gap: 12px; justify-content: center; font-size: 13px; color: rgba(255,255,255,0.35); margin: 6px 0 12px; }
        .timer-block .num { color: #fff; font-weight: 600; font-size: 18px; min-width: 30px; display: inline-block; }
        .day-progress { margin: 10px 0 6px; height: 3px; background: rgba(255,255,255,0.04); border-radius: 10px; overflow: hidden; }
        .day-progress .fill { height: 100%; background: linear-gradient(90deg, #2d6a4f, #52b788); border-radius: 10px; width: 0%; }
        @media (max-width: 500px) { .grid { grid-template-columns: repeat(3, 1fr); } .icon-circle { width: 50px; height: 50px; font-size: 22px; } .time { font-size: 22px; } .header { flex-direction: column; text-align: center; } }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <div><span style="font-size:28px;">🌿</span> <span class="weather" id="weatherBlock">☀️ 22°C</span></div>
        <div><div class="time" id="currentTime">23:02</div><div class="date" id="currentDate">пятница, 17 июля</div></div>
    </div>

    <div class="stats">
        <span>📊 Сайтов: <span class="num" id="siteCount">12</span></span>
        <span>👤 Посетителей: <span class="num" id="visitCounter">0</span></span>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="🔍 Поиск..." />
        <button id="searchBtn">Найти</button>
    </div>

    <div class="tabs" id="tabsContainer">
        <span class="active" data-tab="fav">⭐ Избранное</span>
        <span data-tab="work">💼 Работа</span>
        <span data-tab="fun">🎮 Игры</span>
        <span data-tab="study">📚 Учёба</span>
    </div>

    <div class="grid" id="gridContainer"></div>

    <div class="quote-block" id="quoteBlock">
        <div id="quoteText">Загружаем...</div>
        <div class="author" id="quoteAuthor">—</div>
    </div>

    <div class="timer-block">
        <span>⏳ До вечера:</span>
        <span><span class="num" id="hoursLeft">00</span>ч</span>
        <span><span class="num" id="minutesLeft">00</span>м</span>
        <span><span class="num" id="secondsLeft">00</span>с</span>
    </div>

    <div class="day-progress"><div class="fill" id="dayProgressFill"></div></div>

    <div class="footer">
        <span>🌱 Вдохновение</span>
        <div><button id="newQuote">📜 Цитата</button></div>
    </div>
</div>

<script>
// ДАННЫЕ
const linkData = {
    fav: [
        { name: 'Google', icon: '🌐', url: 'https://www.google.com/' },
        { name: 'YouTube', icon: '▶️', url: 'https://www.youtube.com/' },
        { name: 'GitHub', icon: '🐙', url: 'https://github.com/' },
        { name: 'Telegram', icon: '✈️', url: 'https://web.telegram.org/' },
        { name: 'Почта', icon: '📧', url: 'https://mail.google.com/' },
        { name: 'ChatGPT', icon: '🤖', url: 'https://chat.openai.com/' },
        { name: 'Reddit', icon: '💬', url: 'https://www.reddit.com/' },
        { name: 'Figma', icon: '🎨', url: 'https://www.figma.com/' }
    ],
    work: [
        { name: 'Gmail', icon: '📧', url: 'https://mail.google.com/' },
        { name: 'Drive', icon: '📁', url: 'https://drive.google.com/' },
        { name: 'Docs', icon: '📄', url: 'https://docs.google.com/' },
        { name: 'GitHub', icon: '🐙', url: 'https://github.com/' }
    ],
    fun: [
        { name: 'YouTube', icon: '▶️', url: 'https://www.youtube.com/' },
        { name: 'Twitch', icon: '🎮', url: 'https://www.twitch.tv/' },
        { name: 'Reddit', icon: '💬', url: 'https://www.reddit.com/' },
        { name: 'Spotify', icon: '🎵', url: 'https://open.spotify.com/' }
    ],
    study: [
        { name: 'Wikipedia', icon: '📚', url: 'https://www.wikipedia.org/' },
        { name: 'Scholar', icon: '🎓', url: 'https://scholar.google.com/' },
        { name: 'Coursera', icon: '📖', url: 'https://www.coursera.org/' },
        { name: 'GitHub', icon: '🐙', url: 'https://github.com/' }
    ]
};

const quotes = [
    { text: "Жизнь — это то, что с тобой происходит, пока ты строишь планы.", author: "Джон Леннон" },
    { text: "Не бойся делать то, что не умеешь. Ковчег построил любитель.", author: "Неизвестный" },
    { text: "Будущее принадлежит тем, кто верит в красоту своей мечты.", author: "Элеонора Рузвельт" }
];

let currentTab = 'fav';
let visitCount = parseInt(localStorage.getItem('visitCount') || '0');

// РЕНДЕР СЕТКИ
function renderGrid(tab) {
    const grid = document.getElementById('gridContainer');
    const items = linkData[tab] || linkData.fav;
    grid.innerHTML = '';
    items.forEach(item => {
        const a = document.createElement('a');
        a.className = 'grid-item';
        a.href = item.url;
        a.target = '_blank';
        a.innerHTML = `<div class="icon-circle">${item.icon}</div><span>${item.name}</span>`;
        grid.appendChild(a);
    });
    document.getElementById('siteCount').textContent = items.length;
}

// ВРЕМЯ
function updateTime() {
    const now = new Date();
    document.getElementById('currentTime').textContent = now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Moscow' });
    document.getElementById('currentDate').textContent = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long', timeZone: 'Europe/Moscow' });
}

// ТАЙМЕР ДО ВЕЧЕРА
function updateTimer() {
    const now = new Date();
    const evening = new Date(); evening.setHours(18,0,0,0);
    if (now > evening) evening.setDate(evening.getDate() + 1);
    const diff = Math.floor((evening - now) / 1000);
    document.getElementById('hoursLeft').textContent = String(Math.floor(diff/3600)).padStart(2,'0');
    document.getElementById('minutesLeft').textContent = String(Math.floor((diff%3600)/60)).padStart(2,'0');
    document.getElementById('secondsLeft').textContent = String(diff%60).padStart(2,'0');
}

// ПРОГРЕСС ДНЯ
function updateDayProgress() {
    const now = new Date();
    const start = new Date(); start.setHours(0,0,0,0);
    const end = new Date(); end.setHours(24,0,0,0);
    document.getElementById('dayProgressFill').style.width = ((now - start) / (end - start) * 100) + '%';
}

// ЦИТАТА
function loadQuote() {
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    document.getElementById('quoteText').textContent = `"${q.text}"`;
    document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
}

// ПОГОДА
function updateWeather() {
    const icons = ['☀️','⛅','☁️','🌧️'];
    const temps = [18,22,25,28];
    document.getElementById('weatherBlock').textContent = icons[Math.floor(Math.random()*icons.length)] + ' ' + temps[Math.floor(Math.random()*temps.length)] + '°C';
}

// ПОИСК
document.getElementById('searchBtn').addEventListener('click', () => {
    const q = document.getElementById('searchInput').value.trim();
    if (q) window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
});
document.getElementById('searchInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') document.getElementById('searchBtn').click(); });

// ВКЛАДКИ
document.querySelectorAll('.tabs span').forEach(tab => {
    tab.addEventListener('click', function() {
        document.querySelectorAll('.tabs span').forEach(t => t.classList.remove('active'));
        this.classList.add('active');
        currentTab = this.dataset.tab;
        renderGrid(currentTab);
    });
});

// НОВАЯ ЦИТАТА
document.getElementById('newQuote').addEventListener('click', loadQuote);

// ПОГОДА ПО КЛИКУ
document.getElementById('weatherBlock').addEventListener('click', updateWeather);

// СЧЁТЧИК ПОСЕТИТЕЛЕЙ
visitCount++;
localStorage.setItem('visitCount', visitCount);
document.getElementById('visitCounter').textContent = visitCount;

// ЗАПУСК
renderGrid('fav');
updateTime();
setInterval(updateTime, 10000);
updateTimer();
setInterval(updateTimer, 1000);
updateDayProgress();
setInterval(updateDayProgress, 60000);
loadQuote();
</script>
</body>
</html>
