<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Космический дашборд</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #0b2b3f 0%, #1b4a3b 40%, #2d6a4f 70%, #52b788 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 20px;
            background-attachment: fixed;
            position: relative;
            overflow-x: hidden;
            transition: background 0.8s ease;
        }

        /* КОСМИЧЕСКИЙ РЕЖИМ (переключается кнопкой) */
        body.space-mode {
            background: linear-gradient(145deg, #0a0a1a 0%, #1a0a2e 40%, #2d1b4e 70%, #1a0a2e 100%) !important;
        }

        body.space-mode .container {
            background: rgba(0, 0, 0, 0.55) !important;
            border-color: rgba(255, 255, 255, 0.03) !important;
        }

        body.space-mode .icon-circle {
            background: rgba(255, 255, 255, 0.02) !important;
            border-color: rgba(255, 255, 255, 0.03) !important;
        }

        /* ЧАСТИЦЫ И ЗВЁЗДЫ */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ОБЛАКА (анимированные) */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            opacity: 0.15;
        }

        .cloud {
            position: absolute;
            background: rgba(255,255,255,0.8);
            border-radius: 50%;
            filter: blur(60px);
            animation: floatCloud 25s infinite linear;
        }

        .cloud:nth-child(1) { width: 300px; height: 100px; top: 10%; left: -10%; animation-duration: 30s; }
        .cloud:nth-child(2) { width: 400px; height: 120px; top: 30%; left: -20%; animation-duration: 35s; animation-delay: 5s; }
        .cloud:nth-child(3) { width: 250px; height: 80px; top: 60%; left: -15%; animation-duration: 28s; animation-delay: 10s; }

        @keyframes floatCloud {
            0% { transform: translateX(-20%) scale(1); opacity: 0.3; }
            50% { transform: translateX(120vw) scale(1.2); opacity: 0.6; }
            100% { transform: translateX(-20%) scale(1); opacity: 0.3; }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 25px;
            max-width: 750px;
            width: 100%;
            margin: 0 auto;
            background: rgba(13, 17, 23, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: fadeIn 0.8s ease;
            transition: all 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95) rotate(-1deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        /* ШАПКА */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            color: rgba(255, 255, 255, 0.7);
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .emoji-big { font-size: 32px; animation: pulse 3s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) rotate(5deg); } }

        .weather {
            font-size: 14px;
            background: rgba(255,255,255,0.06);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.04);
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: 0.3s;
        }
        .weather:hover { background: rgba(255,255,255,0.1); }

        .time-block { text-align: right; }
        .time { font-size: 28px; font-weight: 700; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.4); letter-spacing: 1px; }
        .date { font-size: 13px; color: rgba(255, 255, 255, 0.5); margin-top: 2px; }

        /* СТАТИСТИКА */
        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 8px 0 16px;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }
        .stats span { 
            background: rgba(255,255,255,0.03); 
            padding: 4px 14px; 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.02);
        }
        .stats .num { color: #52b788; font-weight: 700; font-size: 14px; }

        /* ПОИСК */
        .search-box {
            margin: 14px 0 22px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.4s;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.25); }
        .search-box input:focus {
            border-color: rgba(82, 183, 136, 0.5);
            background: rgba(255,255,255,0.08);
            box-shadow: 0 0 30px rgba(82, 183, 136, 0.08);
        }

        .search-box button {
            padding: 14px 28px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #2d6a4f, #52b788);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .search-box button:hover { transform: scale(1.05); box-shadow: 0 8px 30px rgba(82, 183, 136, 0.3); }

        /* ВКЛАДКИ */
        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 18px;
        }
        .tabs span {
            padding: 5px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.4);
            font-size: 12px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.02);
            transition: 0.3s;
            user-select: none;
        }
        .tabs span:hover { background: rgba(255,255,255,0.06); color: #fff; }
        .tabs span.active {
            background: rgba(82, 183, 136, 0.2);
            color: #fff;
            border-color: rgba(82, 183, 136, 0.2);
        }

        /* СЕТКА ССЫЛОК (Drag-n-Drop) */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 8px;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: #f0f6fc;
            font-size: 12px;
            transition: all 0.3s ease;
            cursor: grab;
            padding: 6px 4px;
            border-radius: 16px;
            border: 2px solid transparent;
        }

        .grid-item:active { cursor: grabbing; }
        .grid-item.dragging { opacity: 0.3; transform: scale(0.9); }
        .grid-item.drag-over { border-color: #52b788; background: rgba(82,183,136,0.05); }

        .grid-item:hover {
            transform: translateY(-6px) scale(1.04);
            filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
        }

        .icon-circle {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .grid-item:hover .icon-circle {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.12);
            transform: rotate(2deg) scale(1.06);
        }

        .icon-label { font-size: 11px; opacity: 0.75; text-shadow: 0 2px 8px rgba(0,0,0,0.5); font-weight: 500; }

        /* ЦИТАТА ДНЯ + ФАКТ */
        .quote-block {
            margin: 20px 0 12px;
            padding: 16px 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border-left: 3px solid #52b788;
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            font-style: italic;
            line-height: 1.6;
            transition: 0.4s;
            min-height: 70px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .quote-block .author { font-style: normal; font-weight: 600; color: #52b788; font-size: 13px; margin-top: 6px; }
        .quote-block .fact { font-style: normal; font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }

        /* МУЗЫКА */
        .music-player {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 12px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.03);
            flex-wrap: wrap;
        }
        .music-player button {
            background: none;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.3s;
            padding: 4px 10px;
        }
        .music-player button:hover { opacity: 1; transform: scale(1.1); }
        .music-player .track-name { font-size: 13px; color: rgba(255,255,255,0.4); font-weight: 300; }

        /* ПРОГРЕСС-БАР ДНЯ */
        .day-progress {
            margin: 10px 0 6px;
            height: 3px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            overflow: hidden;
        }
        .day-progress .fill {
            height: 100%;
            background: linear-gradient(90deg, #2d6a4f, #52b788, #95d5b2);
            border-radius: 10px;
            transition: width 0.5s;
            width: 0%;
        }

        /* ТАЙМЕР ДО ВЕЧЕРА */
        .timer-block {
            display: flex;
            gap: 12px;
            justify-content: center;
            font-size: 13px;
            color: rgba(255,255,255,0.35);
            margin: 6px 0 12px;
        }
        .timer-block .num { color: #fff; font-weight: 600; font-size: 18px; min-width: 30px; display: inline-block; }
        .timer-block .label { font-size: 11px; color: rgba(255,255,255,0.2); }

        /* ФУТЕР */
        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.15);
            border-top: 1px solid rgba(255, 255, 255, 0.02);
            padding-top: 14px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }
        .footer button {
            background: none;
            border: 1px solid rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.2);
            padding: 4px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            transition: 0.3s;
        }
        .footer button:hover { background: rgba(255,255,255,0.04); color: #fff; }

        /* АДАПТИВ */
        @media (max-width: 600px) {
            .container { padding: 16px 12px; }
            .grid { gap: 8px; }
            .icon-circle { width: 48px; height: 48px; font-size: 22px; }
            .time { font-size: 22px; }
            .header { flex-direction: column; align-items: stretch; text-align: center; }
            .time-block { text-align: center; }
            .weather { justify-content: center; }
            .search-box input { min-width: 120px; padding: 12px 16px; }
            .stats { font-size: 10px; gap: 8px; }
            .stats span { padding: 2px 10px; }
        }
    </style>
</head>
