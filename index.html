<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NIGHT DRIVE | HORIKITA666</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: #0a0a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            touch-action: none;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vmin;
            height: 100vmin;
            max-width: 500px;
            max-height: 700px;
            border: 3px solid #a88aff;
            border-radius: 20px;
            box-shadow: 0 0 30px #a88aff44;
            touch-action: none;
        }
        .ui {
            position: fixed;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
        }
        .ui span {
            background: #00000088;
            padding: 4px 12px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            border: 1px solid #a88aff55;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000bb;
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
        }
        .overlay h1 { font-size: 2.5rem; color: #a88aff; text-shadow: 0 0 12px #a88aff88; }
        .overlay p { color: #ccc; font-size: 1.1rem; margin: 8px 0; }
        .overlay .score-final { font-size: 2rem; color: #ffd966; }
        .btn {
            background: #a88aff;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            color: #0a0a1a;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.1s linear;
        }
        .btn:active { transform: scale(0.96); }
        .hidden { display: none !important; }
        @media (max-width: 500px) {
            .ui { font-size: 0.7rem; padding: 0 8px; }
            .overlay h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="ui">
        <span>🏆 <span id="scoreDisplay">0</span></span>
        <span>⚡ <span id="speedDisplay">1</span>x</span>
        <span>🏅 BEST <span id="bestDisplay">0</span></span>
    </div>
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="startOverlay">
        <h1>🚗 NIGHT DRIVE</h1>
        <p>левая / правая половина экрана — перестроение</p>
        <p style="font-size:0.8rem; color:#888;">избегай машин | собирай звёзды</p>
        <button class="btn" id="startBtn">▶️ СТАРТ</button>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
        <h1>💥 CRASH</h1>
        <p class="score-final" id="finalScore">0</p>
        <p id="bestMsg">🏅 рекорд: 0</p>
        <button class="btn" id="restartBtn">🔄 ЗАНОВО</button>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreSpan = document.getElementById('scoreDisplay');
            const speedSpan = document.getElementById('speedDisplay');
            const bestSpan = document.getElementById('bestDisplay');
            const finalScoreSpan = document.getElementById('finalScore');
            const bestMsgSpan = document.getElementById('bestMsg');
            const startOverlay = document.getElementById('startOverlay');
            const gameOverOverlay = document.getElementById('gameOverOverlay');
            const startBtn = document.getElementById('startBtn');
            const restartBtn = document.getElementById('restartBtn');

            let W, H;
            function resizeCanvas() {
                const rect = canvas.parentElement.getBoundingClientRect();
                const size = Math.min(rect.width, rect.height, 600);
                W = canvas.width = size;
                H = canvas.height = size * 1.25;
                canvas.style.height = H + 'px';
                canvas.style.width = W + 'px';
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            // ======= ЗАГРУЗКА ТЕКСТУР =======
            const textures = {
                asphalt: new Image(),
                grass: new Image(),
                carRed: new Image(),
                carBlue: new Image(),
                carYellow: new Image(),
                playerCar: new Image(),
                star: new Image()
            };
            textures.asphalt.src = 'https://www.transparenttextures.com/patterns/asfalt-dark.png';
            textures.grass.src = 'https://www.transparenttextures.com/patterns/dark-mosaic.png';
            textures.carRed.src = 'https://cdn-icons-png.flaticon.com/512/741/741407.png';
            textures.carBlue.src = 'https://cdn-icons-png.flaticon.com/512/741/741408.png';
            textures.carYellow.src = 'https://cdn-icons-png.flaticon.com/512/741/741409.png';
            textures.playerCar.src = 'https://cdn-icons-png.flaticon.com/512/3206/3206091.png';
            textures.star.src = 'https://cdn-icons-png.flaticon.com/512/182/182866.png';

            let texturesLoaded = 0;
            const totalTextures = 7;
            function checkTextures() {
                texturesLoaded++;
                if (texturesLoaded >= totalTextures) {
                    document.getElementById('startBtn').textContent = '▶️ СТАРТ';
                    document.getElementById('startBtn').disabled = false;
                }
            }
            for (let key in textures) {
                textures[key].onload = checkTextures;
                textures[key].onerror = checkTextures;
            }

            // ======= ИГРОВЫЕ ПЕРЕМЕННЫЕ =======
            let gameActive = false, gameOver = false;
            let score = 0, speed = 2, best = localStorage.getItem('nightDriveBest') ? parseInt(localStorage.getItem('nightDriveBest')) : 0;
            bestSpan.innerText = best;

            const player = { x: W/2 - 30, y: H - 150, w: 60, h: 90, lane: 1, targetX: W/2 - 30 };
            let obstacles = [], stars = [], rain = [], trees = [];
            let roadOffset = 0, spawnCounter = 0;
            for (let i=0; i<180; i++) rain.push({ x: Math.random()*W, y: Math.random()*H, len: 12+Math.random()*18, speed: 5+Math.random()*9 });

            // ======= УПРАВЛЕНИЕ =======
            function handleTap(e) {
                if (!gameActive) return;
                e.preventDefault();
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const canvasX = clientX - rect.left;
                if (canvasX < rect.width/2) {
                    if (player.lane > 0) { player.lane--; player.targetX = player.lane * 180 + 50; }
                } else {
                    if (player.lane < 2) { player.lane++; player.targetX = player.lane * 180 + 50; }
                }
            }
            canvas.addEventListener('touchstart', handleTap);
            canvas.addEventListener('mousedown', handleTap);

            // ======= СПАВН =======
            function spawnObstacle() {
                const lane = Math.floor(Math.random() * 3);
                const x = lane * 180 + 50;
                const colors = [textures.carRed, textures.carBlue, textures.carYellow];
                const color = colors[Math.floor(Math.random() * colors.length)];
                obstacles.push({ x, y: -100, w: 50, h: 80, lane, img: color });
            }

            function spawnStar() {
                const lane = Math.floor(Math.random() * 3);
                const x = lane * 180 + 50;
                stars.push({ x: x + 15, y: -30, r: 20 });
            }

            // ======= ОБНОВЛЕНИЕ =======
            function update() {
                if (!gameActive) return;
                player.x += (player.targetX - player.x) * 0.12;
                speed = 2 + Math.floor(score / 180) * 0.7;
                if (speed > 10) speed = 10;
                speedSpan.innerText = speed.toFixed(1);
                roadOffset = (roadOffset + speed) % 40;
                spawnCounter++;
                let spawnRate = Math.max(15, 45 - Math.floor(speed * 3));
                if (spawnCounter > spawnRate) {
                    spawnCounter = 0;
                    if (Math.random() < 0.55) spawnObstacle();
                    if (Math.random() < 0.3) spawnStar();
                }

                for (let i=obstacles.length-1; i>=0; i--) {
                    const o = obstacles[i];
                    o.y += speed;
                    if (o.y > H + 60) { obstacles.splice(i,1); continue; }
                    if (o.x + o.w > player.x && o.x < player.x + player.w &&
                        o.y + o.h > player.y && o.y < player.y + player.h) {
                        endGame(); return;
                    }
                }

                for (let i=stars.length-1; i>=0; i--) {
                    const s = stars[i];
                    s.y += speed;
                    if (s.y > H + 60) { stars.splice(i,1); continue; }
                    const dx = (player.x + player.w/2) - s.x;
                    const dy = (player.y + player.h/2) - s.y;
                    if (Math.sqrt(dx*dx + dy*dy) < s.r + 25) {
                        score += 15;
                        scoreSpan.innerText = score;
                        stars.splice(i,1);
                        if (score > best) { best = score; localStorage.setItem('nightDriveBest', best); bestSpan.innerText = best; }
                    }
                }

                score += 0.6;
                scoreSpan.innerText = Math.floor(score);
                if (Math.floor(score) > best) {
                    best = Math.floor(score);
                    localStorage.setItem('nightDriveBest', best);
                    bestSpan.innerText = best;
                }

                for (let r of rain) {
                    r.y += r.speed;
                    if (r.y > H) { r.y = -20; r.x = Math.random() * W; }
                }
            }

            // ======= ОТРИСОВКА =======
            function draw() {
                ctx.clearRect(0, 0, W, H);
                ctx.fillStyle = '#0a0a1a';
                ctx.fillRect(0, 0, W, H);

                // дорога с текстурой асфальта
                const patAsphalt = ctx.createPattern(textures.asphalt, 'repeat');
                ctx.fillStyle = patAsphalt;
                ctx.beginPath();
                ctx.moveTo(40, H);
                ctx.lineTo(W/2 - 80, H * 0.45);
                ctx.lineTo(W/2 + 80, H * 0.45);
                ctx.lineTo(W-40, H);
                ctx.closePath();
                ctx.fill();

                // трава (обочина)
                const patGrass = ctx.createPattern(textures.grass, 'repeat');
                ctx.fillStyle = patGrass;
                ctx.fillRect(0, 0, 40, H);
                ctx.fillRect(W-40, 0, 40, H);

                // разметка
                ctx.strokeStyle = '#ffcc44';
                ctx.lineWidth = 3;
                ctx.setLineDash([25, 30]);
                ctx.lineDashOffset = -roadOffset * 2;
                for (let i = 1; i < 3; i++) {
                    const x1 = 40 + i * (W-80)/3;
                    const x2 = W/2 - 80 + i * 160/3;
                    ctx.beginPath();
                    ctx.moveTo(x1, H);
                    ctx.lineTo(x2, H * 0.45);
                    ctx.stroke();
                }
                ctx.setLineDash([]);

                // звёзды (текстура)
                for (let s of stars) {
                    ctx.drawImage(textures.star, s.x - s.r, s.y - s.r, s.r*2, s.r*2);
                }

                // препятствия
                for (let o of obstacles) {
                    ctx.drawImage(o.img, o.x, o.y, o.w, o.h);
                }

                // машина игрока
                ctx.drawImage(textures.playerCar, player.x, player.y, player.w, player.h);

                // дождь
                ctx.strokeStyle = '#8aa8ff44';
                ctx.lineWidth = 1.5;
                for (let r of rain) {
                    ctx.beginPath();
                    ctx.moveTo(r.x, r.y);
                    ctx.lineTo(r.x - 4, r.y + r.len);
                    ctx.stroke();
                }
            }

            // ======= КОНЕЦ ИГРЫ =======
            function endGame() {
                if (gameOver) return;
                gameOver = true;
                gameActive = false;
                finalScoreSpan.innerText = Math.floor(score);
                bestMsgSpan.innerText = `🏅 рекорд: ${best}`;
                gameOverOverlay.classList.remove('hidden');
            }

            // ======= СБРОС =======
            function resetGame() {
                gameOver = false;
                gameActive = true;
                score = 0;
                speed = 2;
                obstacles = [];
                stars = [];
                player.x = W/2 - 30;
                player.y = H - 150;
                player.lane = 1;
                player.targetX = W/2 - 30;
                spawnCounter = 0;
                scoreSpan.innerText = '0';
                speedSpan.innerText = '1.0';
                gameOverOverlay.classList.add('hidden');
                startOverlay.classList.add('hidden');
            }

            // ======= СТАРТ =======
            function startGame() {
                resetGame();
                gameActive = true;
                startOverlay.classList.add('hidden');
                gameOverOverlay.classList.add('hidden');
            }

            startBtn.addEventListener('click', startGame);
            restartBtn.addEventListener('click', resetGame);

            // ======= ЦИКЛ =======
            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            startOverlay.classList.remove('hidden');
            gameActive = false;
            gameLoop();
        })();
    </script>
</body>
        </html>
