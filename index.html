<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Стартовая страница</title>
    <style>
        :root {
            --bg: #0d0d16;
            --glass: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.08);
            --text: #e0e0ec;
            --muted: #77778c;
            --accent: #a78bfa;
            --accent2: #60a5fa;
        }

        .light {
            --bg: #f4f4f8;
            --glass: rgba(0,0,0,0.03);
            --border: rgba(0,0,0,0.08);
            --text: #1a1a24;
            --muted: #6b6b7b;
            --accent: #7c3aed;
            --accent2: #2563eb;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.4s, color 0.4s;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .time-block { text-align: center; }

        #clock {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
        }

        #date {
            color: var(--muted);
            font-size: 16px;
            margin-top: 6px;
        }

        #timezone {
            color: var(--accent);
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
            letter-spacing: 1px;
        }

        .search-wrapper {
            display: flex;
            gap: 8px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 6px;
        }

        .engine {
            background: none;
            border: none;
            color: var(--muted);
            padding: 12px 10px;
            font-size: 13px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }

        .engine.active { background: var(--accent); color: white; }

        #search-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 16px;
            padding: 12px 10px;
            outline: none;
            min-width: 0;
        }

        #search-input::placeholder { color: var(--muted); }

        .links-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .link-item {
            background: var(--glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 8px;
            text-decoration: none;
            color: var(--text);
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .link-item:hover { border-color: var(--accent2); background: rgba(96,165,250,0.05); }
        .link-item .emoji { font-size: 24px; }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--glass);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }

        .theme-toggle:hover { border-color: var(--accent); }

        @media (max-width: 480px) {
            #clock { font-size: 46px; }
            .links-grid { grid-template-columns: repeat(3, 1fr); }
            .search-wrapper { flex-wrap: wrap; }
            .engine { font-size: 12px; padding: 8px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="theme-btn" title="Сменить тему">🌓</button>

    <div class="container">

        <div class="time-block">
            <div id="clock">00:00</div>
            <div id="date">Загрузка...</div>
            <div id="timezone">МСК (UTC+3)</div>
        </div>

        <div class="search-wrapper">
            <button class="engine active" data-engine="google">🌐 Google</button>
            <button class="engine" data-engine="youtube">▶️ YouTube</button>
            <button class="engine" data-engine="github">🐙 GitHub</button>
            <input type="text" id="search-input" placeholder="Поиск..." autofocus>
        </div>

        <div class="links-grid">
            <a class="link-item" href="https://t.me/Horikita666" target="_blank">
                <span class="emoji">✈️</span> Telegram
            </a>
            <a class="link-item" href="https://mail.google.com" target="_blank">
                <span class="emoji">📧</span> Почта
            </a>
            <a class="link-item" href="https://github.com" target="_blank">
                <span class="emoji">🐙</span> GitHub
            </a>
            <a class="link-item" href="https://youtube.com" target="_blank">
                <span class="emoji">▶️</span> YouTube
            </a>
            <a class="link-item" href="https://chat.openai.com" target="_blank">
                <span class="emoji">🤖</span> ChatGPT
            </a>
            <a class="link-item" href="https://news.ycombinator.com" target="_blank">
                <span class="emoji">📰</span> HN
            </a>
            <a class="link-item" href="https://reddit.com" target="_blank">
                <span class="emoji">💬</span> Reddit
            </a>
            <a class="link-item" href="https://figma.com" target="_blank">
                <span class="emoji">🎨</span> Figma
            </a>
        </div>

    </div>

    <script>
        function updateTime() {
            const now = new Date();
            const msk = new Date(now.toLocaleString('en-US', { timeZone: 'Europe/Moscow' }));
            document.getElementById('clock').textContent = 
                msk.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('date').textContent = 
                msk.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        updateTime();
        setInterval(updateTime, 1000);

        const engines = { 
            google: 'https://www.google.com/search?q=', 
            youtube: 'https://www.youtube.com/results?search_query=', 
            github: 'https://github.com/search?q=' 
        };
        let currentEngine = 'google';

        document.querySelectorAll('.engine').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.engine').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentEngine = btn.dataset.engine;
                document.getElementById('search-input').focus();
            });
        });

        document.getElementById('search-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = encodeURIComponent(e.target.value.trim());
                if (query) window.location.href = engines[currentEngine] + query;
            }
        });

        const themeBtn = document.getElementById('theme-btn');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            localStorage.setItem('theme', document.body.classList.contains('light') ? 'light' : 'dark');
        });
        if (localStorage.getItem('theme') === 'light') document.body.classList.add('light');
    </script>

</body>
</html>
