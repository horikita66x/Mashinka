<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3D ГОНКА | HORIKITA666</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { overflow: hidden; background: #0a0a1a; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .ui {
            position: fixed;
            top: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 16px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            font-family: 'Courier New', monospace;
        }
        .ui span {
            background: #00000088;
            padding: 4px 12px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            border: 1px solid #a88aff55;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000bb;
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            text-align: center;
            padding: 20px;
            font-family: 'Courier New', monospace;
        }
        .overlay h1 { font-size: 2.5rem; color: #a88aff; text-shadow: 0 0 12px #a88aff88; }
        .overlay p { color: #ccc; font-size: 1.1rem; margin: 8px 0; }
        .overlay .score-final { font-size: 2rem; color: #ffd966; }
        .btn {
            background: #a88aff;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: bold;
            font-size: 1.2rem;
            font-family: 'Courier New', monospace;
            color: #0a0a1a;
            margin-top: 16px;
            cursor: pointer;
            transition: 0.1s linear;
        }
        .btn:active { transform: scale(0.96); }
        .hidden { display: none !important; }
        @media (max-width: 500px) {
            .ui { font-size: 0.7rem; padding: 0 8px; }
            .overlay h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="ui">
        <span>🏆 <span id="scoreDisplay">0</span></span>
        <span>⚡ <span id="speedDisplay">1</span>x</span>
        <span>🏅 BEST <span id="bestDisplay">0</span></span>
    </div>

    <div id="gameContainer"></div>

    <div class="overlay" id="startOverlay">
        <h1>🚗 3D ГОНКА</h1>
        <p>левая / правая половина экрана — перестроение</p>
        <p style="font-size:0.8rem; color:#888;">избегай машин | собирай звёзды</p>
        <button class="btn" id="startBtn">▶️ СТАРТ</button>
    </div>

    <div class="overlay hidden" id="gameOverOverlay">
        <h1>💥 CRASH</h1>
        <p class="score-final" id="finalScore">0</p>
        <p id="bestMsg">🏅 рекорд: 0</p>
        <button class="btn" id="restartBtn">🔄 ЗАНОВО</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'https://unpkg.com/three@0.126.0/examples/jsm/controls/OrbitControls.js';

        const container = document.getElementById('gameContainer');
        const W = window.innerWidth;
        const H = window.innerHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.Fog(0x0a0a1a, 10, 35);

        const camera = new THREE.PerspectiveCamera(60, W/H, 0.1, 100);
        camera.position.set(0, 3, 8);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(W, H);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Свет
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        scene.add(dirLight);
        const fillLight = new THREE.PointLight(0x4466ff, 0.5, 15);
        fillLight.position.set(0, 3, -2);
        scene.add(fillLight);

        // Дорога
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x1a1f2e, roughness: 0.8, metalness: 0.1 });
        const road = new THREE.Mesh(new THREE.PlaneGeometry(6, 40), roadMat);
        road.rotation.x = -Math.PI/2;
        road.position.z = -15;
        road.receiveShadow = true;
        scene.add(road);

        // Разметка (полосы)
        const lineMat = new THREE.MeshStandardMaterial({ color: 0xffcc44, emissive: 0xff8800, emissiveIntensity: 0.2 });
        for (let i = 0; i < 20; i++) {
            const line = new THREE.Mesh(new THREE.PlaneGeometry(0.15, 1.2), lineMat);
            line.rotation.x = -Math.PI/2;
            line.position.set(-1.5 + Math.random() * 3, 0.02, -i * 2 + 2);
            scene.add(line);
        }

        // Бордюры
        const curbMat = new THREE.MeshStandardMaterial({ color: 0x2a2f4a });
        for (let side of [-3.2, 3.2]) {
            const curb = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 40), curbMat);
            curb.position.set(side, 0.15, -15);
            scene.add(curb);
        }

        // Машина игрока
        const carGroup = new THREE.Group();
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1a2a4a, metalness: 0.6, roughness: 0.4 });
        const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.3, 1.6), bodyMat);
        body.position.y = 0.3;
        body.castShadow = true;
        carGroup.add(body);
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x4488cc, transparent: true, opacity: 0.6 });
        const glass = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.2, 0.6), glassMat);
        glass.position.set(0, 0.5, -0.2);
        carGroup.add(glass);
        const headlightMat = new THREE.MeshStandardMaterial({ color: 0xffdd44, emissive: 0xff8800, emissiveIntensity: 0.3 });
        for (let x of [-0.25, 0.25]) {
            const hl = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), headlightMat);
            hl.position.set(x, 0.15, 0.85);
            carGroup.add(hl);
        }
        carGroup.position.set(0, 0.1, 2);
        scene.add(carGroup);

        // Препятствия и звёзды
        let obstacles = [];
        let stars = [];
        let score = 0;
        let speed = 2;
        let best = parseInt(localStorage.getItem('3dGonkaBest')) || 0;
        document.getElementById('bestDisplay').innerText = best;

        let gameActive = false;
        let gameOver = false;
        let roadOffset = 0;
        let spawnCounter = 0;

        function createObstacle() {
            const colors = [0xcc3355, 0xcc8833, 0x3377cc];
            const mat = new THREE.MeshStandardMaterial({ color: colors[Math.floor(Math.random() * 3)], metalness: 0.4, roughness: 0.6 });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 1.4), mat);
            mesh.position.set((Math.random() - 0.5) * 3, 0.15, -30);
            mesh.castShadow = true;
            scene.add(mesh);
            obstacles.push({ mesh, z: -30, speed: 0 });
        }

        function createStar() {
            const mat = new THREE.MeshStandardMaterial({ color: 0xffd966, emissive: 0xff8800, emissiveIntensity: 0.5 });
            const mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.2), mat);
            mesh.position.set((Math.random() - 0.5) * 3, 0.4, -30);
            scene.add(mesh);
            stars.push({ mesh, z: -30, angle: 0 });
        }

        // Управление
        let targetLane = 0;
        function handleTap(e) {
            if (!gameActive) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const half = window.innerWidth / 2;
            targetLane += (clientX < half) ? -1 : 1;
            targetLane = Math.max(-1.5, Math.min(1.5, targetLane));
        }
        window.addEventListener('touchstart', handleTap);
        window.addEventListener('mousedown', handleTap);

        // Старт / рестарт
        function startGame() {
            gameActive = true;
            gameOver = false;
            score = 0;
            speed = 2;
            obstacles.forEach(o => { scene.remove(o.mesh); });
            stars.forEach(s => { scene.remove(s.mesh); });
            obstacles = [];
            stars = [];
            targetLane = 0;
            carGroup.position.x = 0;
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');
            updateUI();
        }

        function endGame() {
            if (gameOver) return;
            gameOver = true;
            gameActive = false;
            document.getElementById('finalScore').innerText = Math.floor(score);
            document.getElementById('bestMsg').innerText = `🏅 рекорд: ${best}`;
            document.getElementById('gameOverOverlay').classList.remove('hidden');
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = Math.floor(score);
            document.getElementById('speedDisplay').innerText = speed.toFixed(1);
            if (Math.floor(score) > best) {
                best = Math.floor(score);
                localStorage.setItem('3dGonkaBest', best);
                document.getElementById('bestDisplay').innerText = best;
            }
        }

        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        // Анимация
        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                speed = 2 + Math.floor(score / 100) * 0.5;
                if (speed > 8) speed = 8;

                // Движение машины
                carGroup.position.x += (targetLane - carGroup.position.x) * 0.08;

                // Спавн
                spawnCounter++;
                const spawnRate = Math.max(15, 45 - speed * 3);
                if (spawnCounter > spawnRate) {
                    spawnCounter = 0;
                    if (Math.random() < 0.55) createObstacle();
                    if (Math.random() < 0.3) createStar();
                }

                // Движение препятствий
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const o = obstacles[i];
                    o.z += speed * 0.1;
                    o.mesh.position.z = o.z;
                    if (o.z > 5) {
                        scene.remove(o.mesh);
                        obstacles.splice(i, 1);
                        continue;
                    }
                    // Столкновение
                    if (Math.abs(o.mesh.position.x - carGroup.position.x) < 0.8 && o.z > 1.5 && o.z < 2.5) {
                        endGame();
                    }
                }

                // Движение звёзд
                for (let i = stars.length - 1; i >= 0; i--) {
                    const s = stars[i];
                    s.z += speed * 0.1;
                    s.mesh.position.z = s.z;
                    s.mesh.rotation.y += 0.05;
                    if (s.z > 5) {
                        scene.remove(s.mesh);
                        stars.splice(i, 1);
                        continue;
                    }
                    // Сбор звезды
                    if (Math.abs(s.mesh.position.x - carGroup.position.x) < 0.6 && s.z > 1.5 && s.z < 2.5) {
                        score += 15;
                        scene.remove(s.mesh);
                        stars.splice(i, 1);
                        updateUI();
                        if (Math.floor(score) > best) {
                            best = Math.floor(score);
                            localStorage.setItem('3dGonkaBest', best);
                            document.getElementById('bestDisplay').innerText = best;
                        }
                    }
                }

                score += 0.5;
                updateUI();
            }

            // Камера следит за машиной
            camera.position.x = carGroup.position.x * 0.8;
            camera.lookAt(carGroup.position.x * 0.4, 0, -2);

            renderer.render(scene, camera);
        }

        // Адаптация размера
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        animate();

        // Небольшие огни по краям
        for (let i = 0; i < 20; i++) {
            const lightMat = new THREE.MeshStandardMaterial({ color: 0xff8800, emissive: 0xff4400, emissiveIntensity: 0.3 });
            const light = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), lightMat);
            light.position.set(-3 + (i % 2) * 6, 0.5, -i * 2 + 2);
            scene.add(light);
        }
    </script>
</body>
</html>
